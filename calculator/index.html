<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>Calculator</header>
  <main>
    <input type="text" name="cal" id="cal" class="inp" placeholder="Enter numbers." readonly>
    <div class="btns">
      <button class="btn b1">1</button>
      <button class="btn b2">2</button>
      <button class="btn b3">3</button>
      <button class="btn bSum">+</button>
      <button class="btn b4">4</button>
      <button class="btn b5">5</button>
      <button class="btn b6">6</button>
      <button class="btn bSub">-</button>
      <button class="btn b7">7</button>
      <button class="btn b8">8</button>
      <button class="btn b9">9</button>
      <button class="btn bMul">*</button>
      <button class="btn b0">0</button>
      <button class="btn c">c</button>
      <button class="btn bc">BC</button>
      <button class="btn bDiv">/</button>
      <button class="btn equal">=</button>
      
    </div>
  </main>
  <script src="app.js"></script>
</body>

</html>
