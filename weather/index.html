<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="section1">
      <img src="https://www.pixelstalk.net/wp-content/uploads/2016/07/Download-Free-Weather-Background.jpg"
        alt="image1">
      <header>
        <div class="logo">forecast</div>
        <div class="location-box">
          <div class="icon">L</div>
          <div class="location">
            <span>current Location</span>
            <span>Chennai, Tamil Nadu</span>
          </div>
        </div>
      </header>
      <div class="center-page">
        <h3>The Only Weather Forecast You Need</h3>
        <div class="line"></div>
        <div class="search">
          <div class="search-bar">
            <input type="text" name="search" id="search-inp" class="search-inp" placeholder="Enter location">
          <div class="search-icon">S</div>
          </div>
          <div class="geo-icon">G</div>
        </div>
      </div>
    </div>
    <div class="section2">
      <nav>
        <ul>
          <li>Weather</li>
          <li>Alerts</li>
          <li>Map</li>
          <li>Satellite</li>
          <li>News</li>
        </ul>
      </nav>
      <h1>Today</h1>
      <div class="card">
        <div class="temp">
          <span>32 <sup>.</sup></span>
          <div>
            <span>sunny</span>
            <img src="" alt="sunny">
          </div>
          <span>Monday 27, July 2026</span>
        </div>
        <div class="details"></div>
      </div>
      <h2>Daily</h2>
      <div class="cards">
        <div class="sm-card">
          <span>28 <sup>.</sup></span>
          <div>
            <span>Rain</span>
            <img src="" alt="">
          </div>
          <span>Tue 28, July 2026</span>
        </div>

        <div class="sm-card">
          <span>28 <sup>.</sup></span>
          <div>
            <span>Rain</span>
            <img src="" alt="">
          </div>
          <span>Tue 28, July 2026</span>
        </div>
        
        <div class="sm-card">
          <span>28 <sup>.</sup></span>
          <div>
            <span>Rain</span>
            <img src="" alt="">
          </div>
          <span>Tue 28, July 2026</span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
